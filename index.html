<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0D0E0D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sequential Companion">
<title>Sequential Companion</title>
<!-- Sequential Companion: pattern card generator for Digitakt 2 and similar step sequencers. MIT, (c) Kirill Kinderhart. Design language shared with Producer Companion. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one instrument panel. Dial strip on top shows the active module, bottom key bar switches modules,
   each module is a control card (keys, slider, go-button) above a dark-headed readout sheet. */
:root{
  --bg:#D4D5D2; --panel:#E2E3E0; --ink:#1A1B1A; --ink2:#575A56; --line:#A6A8A4; --line2:#C4C6C2;
  --key:#CFD0CC; --key-top:#EDEEEB; --key-sh:#9C9E9A;
  --screen:#131413; --screen-ink:#E6E7E3; --screen-dim:#9A9D98;
  --on-ink:#E8E9E6; --lamp:#E8461B; --lamp-off:#8C8E8A;
  --tex:repeating-linear-gradient(90deg,rgba(0,0,0,.022) 0 1px,transparent 1px 3px);
  --f-ui:'IBM Plex Sans Condensed','Arial Narrow',system-ui,'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,'Hiragino Sans','Yu Gothic','Noto Sans JP',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111211; --panel:#1B1C1B; --ink:#E4E5E1; --ink2:#A0A39E; --line:#3A3C39; --line2:#2A2C2A;
    --key:#272927; --key-top:#3B3D3A; --key-sh:#0A0B0A;
    --screen:#0A0B0A; --screen-ink:#E6E7E3; --screen-dim:#8E918C;
    --on-ink:#141514; color-scheme:dark; --tex:none;
  }
}
:root[data-theme="dark"]{
  --tex:none;
  --bg:#111211; --panel:#1B1C1B; --ink:#E4E5E1; --ink2:#A0A39E; --line:#3A3C39; --line2:#2A2C2A;
  --key:#272927; --key-top:#3B3D3A; --key-sh:#0A0B0A;
  --screen:#0A0B0A; --screen-ink:#E6E7E3; --screen-dim:#8E918C;
  --on-ink:#141514; color-scheme:dark;
}
/* manual skins, chosen with the header button; default is automatic */
:root[data-skin="white"]{
  --tex:none;
  --bg:#FFFFFF; --panel:#F5F5F4; --ink:#111211; --ink2:#5A5C59; --line:#BEC0BC; --line2:#E0E1DE;
  --key:#ECEDEB; --key-top:#FFFFFF; --key-sh:#B4B6B2;
  --screen:#131413; --screen-ink:#E6E7E3; --screen-dim:#9A9D98;
  --on-ink:#F4F5F2; color-scheme:light;
}
:root[data-skin="grey"]{
  --bg:#D4D5D2; --panel:#E2E3E0; --ink:#1A1B1A; --ink2:#575A56; --line:#A6A8A4; --line2:#C4C6C2;
  --key:#CFD0CC; --key-top:#EDEEEB; --key-sh:#9C9E9A;
  --screen:#131413; --screen-ink:#E6E7E3; --screen-dim:#9A9D98;
  --on-ink:#E8E9E6; color-scheme:light;
}
:root[data-skin="dark"]{
  --tex:none;
  --bg:#111211; --panel:#1B1C1B; --ink:#E4E5E1; --ink2:#A0A39E; --line:#3A3C39; --line2:#2A2C2A;
  --key:#272927; --key-top:#3B3D3A; --key-sh:#0A0B0A;
  --screen:#0A0B0A; --screen-ink:#E6E7E3; --screen-dim:#8E918C;
  --on-ink:#141514; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg) var(--tex);color:var(--ink);font:14px/1.45 var(--f-ui);
  padding-block:12px 112px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,select,input{font:inherit;color:inherit}
.device{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
/* header + dial stay pinned so you always see where you are */
.stick{position:sticky;top:0;z-index:25;display:flex;flex-direction:column;gap:14px;background:var(--bg);margin:0 -4px;padding:max(8px,env(safe-area-inset-top,0px)) 4px 10px;box-shadow:0 1px 0 var(--line2)}
.mono{font-family:var(--f-mono)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{flex:none;display:flex;align-items:center;color:var(--ink)}
.mark svg{display:block;width:46px;height:auto}
.wm{display:flex;min-width:0;color:var(--ink)}
.wm .nm{display:block;height:28px;width:auto}
.meter{display:flex;align-items:center;gap:8px;flex:none}
.lamp{width:10px;height:10px;border-radius:50%;background:var(--lamp-off);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);transition:background .08s,box-shadow .08s}
.lamp.on{background:var(--lamp);box-shadow:0 0 0 1px rgba(0,0,0,.2),0 0 10px 2px color-mix(in srgb,var(--lamp) 60%,transparent)}
.counter{font:500 13px/1 var(--f-mono);background:var(--screen);color:var(--screen-ink);padding:6px 7px;border-radius:2px;letter-spacing:.12em}

/* dial */
.dial{position:relative;flex:1;min-width:0;height:50px;background:var(--panel);border:1px solid var(--line);border-radius:3px;overflow:hidden;--pos:16.67%}
.dial .sw{position:absolute;inset:0 12px}
.dial .minor,.dial .major{position:absolute;left:0;right:0;bottom:0;border-right:1px solid var(--ink2)}
.dial .minor{height:7px;background:repeating-linear-gradient(90deg,var(--ink2) 0 1px,transparent 1px 2.5%)}
.dial .major{height:14px;background:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 10%)}
.dial .dl{position:absolute;top:8px;transform:translateX(-50%);font:600 9.5px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);white-space:nowrap;transition:color .2s}
.dial .dl.on{color:var(--ink)}
.dial .needle{position:absolute;top:21px;bottom:0;width:2px;margin-left:-1px;left:var(--pos);background:var(--lamp);transition:left .38s cubic-bezier(.3,1.35,.5,1)}
.dial.scan .needle{animation:scan .7s ease-in-out}
@keyframes scan{0%{transform:translateX(0)}20%{transform:translateX(-44px)}55%{transform:translateX(52px)}80%{transform:translateX(-14px)}100%{transform:translateX(0)}}

/* dial row */
.dialrow{display:flex;gap:6px;align-items:stretch}
/* modules */
.mod{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 1px 0 var(--key-top),0 1px 0 var(--line2)}
.grp{display:flex;flex-direction:column;gap:8px}
.cap{display:flex;align-items:center;gap:10px;font:600 10.5px/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.cap::after{content:"";flex:1;height:1px;background:var(--line)}
.cap em{font-style:normal;color:var(--ink);font-family:var(--f-mono);letter-spacing:.04em;order:2;margin-left:auto}
.cap em+*{order:3}
.cap::after{order:1}
.capb{width:100%;min-height:28px;padding:0;border:0;background:none;text-align:left;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.capb i{order:3;flex:none;display:flex;width:26px;justify-content:center;transition:transform .15s}
.capb[aria-expanded="true"] i{transform:rotate(180deg)}
.fb{display:flex;flex-direction:column;gap:10px}
.grid3,.grid4{display:grid;gap:6px}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
.note{font-size:12px;color:var(--ink2);margin:0}

/* keys */
.key{
  position:relative;display:flex;align-items:center;justify-content:center;text-align:center;gap:6px;
  min-height:44px;padding:8px 6px;border:1px solid var(--line);border-radius:3px;background:var(--key);color:var(--ink);
  font:600 12px/1.1 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;cursor:pointer;
  box-shadow:inset 0 1px 0 var(--key-top),0 1px 0 var(--key-sh);
  transition:transform .06s,background .08s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.key:active{transform:translateY(1px);box-shadow:inset 0 1px 3px var(--key-sh)}
.key[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink);box-shadow:inset 0 1px 3px rgba(0,0,0,.55)}
.key[aria-pressed="true"]::before{content:"";position:absolute;top:5px;left:5px;width:4px;height:4px;border-radius:50%;background:var(--on-ink)}
.key:focus-visible,.ib:focus-visible,.go:focus-visible,select:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.seg .key{border-radius:0;margin-left:-1px}
.seg .key:first-child{border-radius:3px 0 0 3px;margin-left:0}
.seg .key:last-child{border-radius:0 3px 3px 0}
.seg .key[aria-pressed="true"]{z-index:1}
.go{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;
  background:var(--ink);color:var(--on-ink);border:1px solid var(--ink);border-radius:3px;
  font:700 13.5px/1.1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
  box-shadow:0 2px 0 var(--key-sh);touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.go:active{transform:translateY(1px);box-shadow:0 1px 0 var(--key-sh)}
.go .led{width:8px;height:8px;border-radius:50%;background:var(--lamp-off);transition:background .08s}
.go.busy .led{background:var(--lamp)}
.go{position:relative}
.go .seq{position:absolute;left:14px;right:14px;bottom:6px;display:flex;gap:2px;pointer-events:none}
.go .seq i{flex:1;height:4px;background:rgba(255,255,255,.13);border-radius:1px}
.go .seq i:nth-child(4n+1){background:rgba(255,255,255,.26)}
.go .seq i:nth-child(4n){margin-right:5px}
.go .seq i:last-child{margin-right:0}
.go .seq i.on{background:var(--lamp);box-shadow:0 0 5px var(--lamp)}
.ib{
  flex:none;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:3px;background:var(--key);color:var(--ink);cursor:pointer;
  box-shadow:inset 0 1px 0 var(--key-top),0 1px 0 var(--key-sh);touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.ib:active{transform:translateY(1px)}
.ib[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.ib.dk{background:transparent;border-color:#3a3d39;color:var(--screen-ink);box-shadow:none}
.ib svg{display:block}

/* lcd + slider */
.lcd{background:var(--screen);color:var(--screen-ink);border-radius:3px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.lcd .big{font:500 46px/1 var(--f-mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.lcd .unit{font:500 11px/1 var(--f-mono);color:var(--screen-dim);letter-spacing:.14em;margin-left:6px}
.lcd .side{text-align:right;font:400 11px/1.5 var(--f-mono);color:var(--screen-dim)}
.step{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:6px}
.step .lcd{justify-content:center;padding:6px 10px}
.step .lcd .big{font-size:28px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--ink);border-radius:0}
input[type=range]::-moz-range-track{height:3px;background:var(--ink);border-radius:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:30px;margin-top:-13.5px;border:1px solid var(--ink);border-radius:2px;background:linear-gradient(90deg,transparent 8px,var(--ink) 8px 10px,transparent 10px),var(--key);box-shadow:inset 0 1px 0 var(--key-top),0 1px 2px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:16px;height:28px;border:1px solid var(--ink);border-radius:2px;background:linear-gradient(90deg,transparent 7px,var(--ink) 7px 9px,transparent 9px),var(--key);box-shadow:inset 0 1px 0 var(--key-top),0 1px 2px rgba(0,0,0,.35)}
.ticks{position:relative;height:26px;margin:0 9px}
.ticks::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;border-right:1px solid var(--ink2);background:repeating-linear-gradient(90deg,var(--ink2) 0 1px,transparent 1px calc(100%/14))}
.ticks span{position:absolute;top:11px;transform:translateX(-50%);font:500 10px/1 var(--f-mono);color:var(--ink2)}
.t5{display:flex;justify-content:space-between;margin:0 9px}
.t5 i{width:1px;height:8px;background:var(--ink2)}
.t5l{display:flex;justify-content:space-between;font:500 10px/1 var(--f-mono);color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.sel{position:relative}
.sel select{-webkit-appearance:none;appearance:none;width:100%;min-height:44px;padding:8px 36px 8px 12px;border:1px solid var(--line);border-radius:3px;background:var(--key);color:var(--ink);font:600 13px/1.1 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;box-shadow:inset 0 1px 0 var(--key-top),0 1px 0 var(--key-sh)}
.sel::after{content:"";position:absolute;right:15px;top:50%;width:6px;height:6px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}

/* output sheets */
.out{display:block}
.out.busy{opacity:.3;transition:opacity .1s}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden;box-shadow:0 1px 0 var(--line2)}
.sheet-h{background:var(--screen);color:var(--screen-ink);padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.sheet-h .id{display:flex;justify-content:space-between;gap:12px;font:500 10.5px/1.2 var(--f-mono);letter-spacing:.12em;color:var(--screen-dim);text-transform:uppercase}
.sheet-h h2{margin:0;font:600 20px/1.2 var(--f-mono);letter-spacing:-.01em;text-transform:uppercase;overflow-wrap:anywhere;min-width:0}
.sheet-h .sub{font:400 12px/1.5 var(--f-mono);color:var(--screen-dim);overflow-wrap:anywhere}
.hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font:500 10.5px/1 var(--f-mono);border:1px solid #3a3d39;color:var(--screen-ink);padding:4px 6px;border-radius:2px;letter-spacing:.04em;text-transform:uppercase}
.sec{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:minmax(86px,32%) minmax(0,1fr);gap:4px 12px;padding:8px 0 0;border-top:1px solid var(--line2)}
.kv .k{font:600 10.5px/1.6 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.kv .v{margin:0;overflow-wrap:anywhere;min-width:0;display:flex;flex-direction:column;gap:3px}
.kv .v.m{font:500 12.5px/1.5 var(--f-mono)}
.gh{font:600 10.5px/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);padding:10px 0 2px;border-bottom:1px solid var(--ink)}
.gh:first-of-type{padding-top:0}
.strip{display:flex;gap:2px;height:20px}
.strip>div{min-width:0;position:relative;overflow:hidden;background:var(--line2)}
.strip i{position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(0);transition:transform .34s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i,0)*60ms)}
.strip>div:nth-child(even) i{opacity:.45}
.letters{display:flex;gap:2px;font:500 10px/1 var(--f-mono);color:var(--ink2)}
.letters div{min-width:0;overflow:hidden}
.mb{height:3px;background:var(--line2);margin-top:4px}
.mb i{display:block;height:100%;background:var(--ink);transform-origin:left;transform:scaleX(0);transition:transform .34s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i,0)*45ms)}
.in .strip i,.in .mb i{transform:scaleX(1)}
.frow{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:8px 0 2px;border-top:1px solid var(--line2)}
.frow .L{font:600 12px/1.4 var(--f-mono);color:var(--ink2)}
.frow .fh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px}
.frow .fh b{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.frow .fh span{font:500 11.5px/1.5 var(--f-mono);color:var(--ink2)}
.frow p{margin:3px 0 0;color:var(--ink);font-size:13.5px}
.total{display:flex;justify-content:space-between;gap:10px;font:500 12px/1.4 var(--f-mono);border-top:1px solid var(--ink);padding-top:8px}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:14px;border-top:1px solid var(--line)}
.acts .key{gap:8px}

/* names */
.alias{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line2)}
.alias .nm{font:600 18px/1.25 var(--f-mono);overflow-wrap:anywhere;min-width:0}
.trk{display:grid;grid-template-columns:24px minmax(0,1fr) 36px;gap:10px;padding:10px 0;border-top:1px solid var(--line2);align-items:start}
.trk .n{font:500 12px/1.9 var(--f-mono);color:var(--ink2)}
.trk .t{font:600 15px/1.35 var(--f-mono);overflow-wrap:anywhere}
.trk .meta{display:flex;flex-wrap:wrap;gap:2px 12px;font:500 11.5px/1.5 var(--f-mono);color:var(--ink2);margin-top:2px}
.fld{display:grid;grid-template-columns:minmax(0,1fr) 36px;gap:2px 8px;padding:10px 0 4px;border-top:1px solid var(--line2)}
.fld .k{font:600 10.5px/1.6 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.fld .v{grid-column:1;margin:0;font-size:15px;line-height:1.5;display:block}
.fld .ib{grid-column:2;grid-row:1/3;align-self:start}

/* nav + toast */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar>div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.bar .key{min-height:48px;flex-direction:column;gap:3px}
.bar .key small{font:500 10px/1 var(--f-mono);opacity:.7;letter-spacing:.08em}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);z-index:30;background:var(--ink);color:var(--on-ink);font:500 12px/1 var(--f-mono);padding:9px 12px;border-radius:3px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{font:400 11px/1.5 var(--f-mono);color:var(--ink2);text-align:center;margin:2px 0 0}

/* wipe-in for prose */
@keyframes wipe{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
.anim .wipe,.w-now{animation:wipe .38s ease-out both;animation-delay:calc(var(--i,0)*28ms)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (max-width:360px){
    .lcd .big{font-size:40px}
  .dial .dl{font-size:7.5px;letter-spacing:-.02em}
  .tools{gap:4px}
  .mark svg{width:38px}
  .wm .nm{height:23px}
}

/* ===== header, counter window, wide layouts, boot screen ===== */
:root{--b-bg:var(--bg);--b-ink:var(--ink);--b-dim:var(--ink2);--b-line:var(--line);--w-ink:var(--screen-ink);--w-dim:var(--screen-dim);--w-line:#2B2D2A}
.tools{display:flex;gap:6px}
html[lang="ja"] body *{letter-spacing:.02em!important}
#langBtn{font:600 11px/1 var(--f-mono);letter-spacing:.04em}
.lw{position:relative}

.pc.g{--h:34%}.pc.n{--h:68%}.pc.a{--h:100%}

.pc.a::after{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--lamp)}
.pc .cm{position:absolute;right:0;bottom:0;width:0;height:0;border-bottom:8px solid var(--lamp);border-left:8px solid transparent}
.pc .pm{position:absolute;left:3px;top:7px;width:5px;height:5px;background:var(--bg);border:1px solid var(--ink);transform:rotate(45deg);z-index:2}
.pc:active{transform:translateY(1px)}
.pcn{width:22px;margin-left:4px;flex:none;align-self:center;text-align:right;font:600 11px/1 var(--f-mono)}
.pcn.z{color:var(--ink2);font-weight:400}
.pleg{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 10px/1 var(--f-mono);color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;align-items:center}
.pleg .sw{display:inline-block;width:12px;height:12px;border:1px solid var(--ink);position:relative;overflow:hidden;vertical-align:-2px;margin-right:5px;background:var(--key)}
.pleg .sw::before{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--h,0);background:var(--ink)}
.pleg .sw.g{--h:34%}.pleg .sw.n{--h:68%}.pleg .sw.a{--h:100%}
.pleg .sw.a::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--lamp)}
.pleg .sw.c{background:var(--key)}
.pleg .sw.c::after{content:"";position:absolute;right:0;bottom:0;border-bottom:6px solid var(--lamp);border-left:6px solid transparent}
.pleg .sw.p{transform:rotate(45deg) scale(.55);background:var(--bg)}
.tx{margin:0;font:500 12px/1.6 var(--f-mono);white-space:pre;overflow-x:auto;color:var(--ink);padding:2px 0 4px}
.sliders{display:flex;flex-direction:column;gap:6px}
.sl .cap{margin-bottom:0}
.seedlcd{padding:8px 12px}
.seedin{flex:1;min-width:0;width:100%;background:transparent;border:0;outline:0;color:var(--screen-ink);font:500 26px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:0}
.seedin:focus-visible{outline:1px solid var(--screen-dim);outline-offset:3px}
.sv-a .key:last-child{grid-column:1/-1}
.sv-x{font-family:var(--f-mono);white-space:pre}
#sndBtn{width:auto;padding:0 10px;gap:7px;font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
@media (max-width:420px){#sndBtn span{display:none}#sndBtn{width:36px;padding:0}}
@media print{
  @page{margin:12mm}
  html,body{background:#fff!important}
  body *{visibility:hidden}
  .sheet,.sheet *{visibility:visible}
  .sheet{position:absolute;left:0;top:0;width:100%;border:1.5px solid #000;--panel:#fff;--ink:#000;--ink2:#555;--line:#999;--line2:#ccc;--key:#fff;--key-top:#fff;--bg:#fff;--lamp:#000;--screen:#fff;--screen-ink:#000;--screen-dim:#555;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}

  .acts,.capb i{display:none!important}

/* ===== Sequential Companion: boot matrix + write/erase animations ===== */
.bt-mx{height:auto;padding:14px 16px;display:flex;align-items:center;justify-content:center}
.bt-grid{display:flex;flex-direction:column;gap:clamp(4px,1.1vw,7px);width:100%}
.bt-grid .r{display:grid;grid-template-columns:repeat(16,1fr);gap:clamp(4px,1.1vw,7px)}
.bt-grid i{aspect-ratio:1;border-radius:50%;background:var(--w-ink);opacity:.14;transition:opacity .08s,background .08s,box-shadow .08s,transform .08s}
.bt-grid i.on{opacity:.9}
.bt-grid i.acc{opacity:1;background:var(--lamp);box-shadow:0 0 8px color-mix(in srgb,var(--lamp) 70%,transparent)}
.bt-grid i.ph{opacity:.5;transform:scale(1.18)}
.bt-grid i.ph.on{opacity:1}
.bt-grid i.hit{background:#fff;box-shadow:0 0 10px 1px rgba(255,255,255,.6)}
.bt-grid i.lg{opacity:1;background:var(--lamp);box-shadow:0 0 9px color-mix(in srgb,var(--lamp) 75%,transparent);transform:none}
#boot.lock .bt-lcd .big svg{filter:none}
.lp.lit i{background:var(--lamp);box-shadow:0 0 8px color-mix(in srgb,var(--lamp) 70%,transparent)}
.bt-seg i{height:10px}
/* generation: old pattern is wiped column by column, new one is written step by step */
@keyframes scErase{0%{opacity:1;transform:none}60%{opacity:.35}100%{opacity:0;transform:scaleY(.2)}}
@keyframes scWrite{0%{opacity:0;transform:scale(.4);filter:brightness(2.2)}55%{opacity:1;transform:scale(1.06);filter:brightness(1.6)}100%{opacity:1;transform:none;filter:none}}
@keyframes scFade{from{opacity:0}to{opacity:1}}
@keyframes scTick{0%{opacity:.2}50%{opacity:1}100%{opacity:1}}
.sheet.er .pc{animation:scErase .2s ease-in both;animation-delay:calc(var(--c)*18ms)}
.sheet.er .pcn,.sheet.er .tx{transition:opacity .2s;opacity:0}
.sheet.wr .pc{animation:scWrite .26s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--c)*44ms)}
.sheet.wr .pruler{animation:scFade .3s both}
.sheet.wr .tx,.sheet.wr .pleg,.sheet.wr .pcn{animation:scFade .35s .75s both}
.counter.tk{animation:scTick .5s steps(5,end)}
@keyframes seqscan{from{left:0}to{left:100%}}
@media (prefers-reduced-motion:reduce){.sheet.er .pc,.sheet.wr .pc,.sheet.wr .tx,.counter.tk{animation:none}}
.dial .needle,.dial .minor,.dial .major{display:none}
.dial .mx{position:absolute;left:0;right:0;bottom:6px;width:100%;height:24px;display:block}

/* fidget: a pad of 128 dots, a spinning encoder that rotates the pattern */
.fid{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;display:flex;align-items:center;justify-content:center;overscroll-behavior:contain;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.fid[hidden]{display:none}
.fid-in{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.fid-h{display:flex;align-items:center;justify-content:space-between}
.fid-h b{font:600 11px/1 var(--f-mono);letter-spacing:.26em;text-transform:uppercase}
.fid .lcd .big{font-size:40px}
.fgrid{display:grid;grid-template-columns:repeat(16,1fr);gap:clamp(3px,1vw,5px);padding:12px;background:var(--screen);border-radius:4px;touch-action:none;position:relative;isolation:isolate;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),inset 0 8px 16px -6px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.38)}
.fgrid i{aspect-ratio:1;border-radius:50%;background:var(--screen-ink);opacity:.14;transition:opacity .06s,transform .06s,background .06s}
.fgrid i.on{opacity:.92}
.fgrid i.r0.on{background:var(--lamp);opacity:1}
.fgrid i.ph{transform:scale(1.22);opacity:.5}
.fgrid i.ph.on{opacity:1;background:#fff}
.fgrid i.ph.r0.on{background:var(--lamp)}
.fgrid i.rs{opacity:.3}.fgrid i.rs.on{opacity:1}
.trig{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 1px}.trig .gp{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.trig .tk{display:flex;flex-direction:column;align-items:center;gap:7px;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.trig .tk i{width:5px;height:5px;border-radius:50%;background:var(--lamp-off);transition:background .05s,box-shadow .05s}
.trig .tk.on i{background:var(--lamp);box-shadow:0 0 6px var(--lamp)}
.trig .tk b{display:block;width:100%;height:clamp(44px,9vh,66px);border-radius:2px;background:var(--key);box-shadow:inset 0 1px 0 var(--key-top),0 2px 0 var(--key-sh);transition:transform .04s}
.trig .tk.f b{background:linear-gradient(var(--key),var(--key));box-shadow:inset 0 1px 0 var(--key-top),0 2px 0 var(--key-sh),inset 0 -3px 0 color-mix(in srgb,var(--lamp) 55%,transparent)}
.trig .tk:active b,.trig .tk.dn b{transform:translateY(2px);box-shadow:inset 0 1px 0 var(--key-top)}
.trig .tk.ph b{background:var(--key-top)}
.trn{text-align:center;font:500 10.5px/1 var(--f-mono);letter-spacing:.2em;color:var(--ink2);text-transform:uppercase;margin-top:-4px}
#fKeys{gap:8px}
#fKeys .key{min-height:clamp(54px,10vh,84px);flex-direction:column;gap:6px}
#fKeys .key small{font:500 11px/1 var(--f-mono);opacity:.8}
@media (max-height:640px) and (orientation:landscape){.fid{align-items:flex-start}.fid-in{max-width:760px;margin:auto}}
.bt-mx::after{display:none!important}

/* variations, track length, wide action */
.vt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 10px}
.vt .key{min-height:38px;letter-spacing:.14em}
.pc.lo{opacity:.28;pointer-events:none}
.acts .key.wide{grid-column:1/-1}
.bt-grid i.dim{opacity:.45}.bt-grid i.acc.dim{opacity:.8}
.bt-grid i.fl{opacity:.9;background:var(--w-ink);box-shadow:none}

/* ===== boot variants 5-8 ===== */
#boot.alt .bt-dial::before{z-index:4}
.bt-led{position:absolute;left:22px;right:22px;top:40px;display:flex;justify-content:space-between}
.bt-led i{width:8px;height:8px;border-radius:50%;background:var(--w-ink);opacity:.16;transition:opacity .06s,background .06s,box-shadow .06s}
.bt-led i.on{opacity:.9}.bt-led i.acc{opacity:1;background:var(--lamp);box-shadow:0 0 8px color-mix(in srgb,var(--lamp) 70%,transparent)}
.bt-scale.sx .t1{height:8px;background:repeating-linear-gradient(90deg,var(--w-ink) 0 1px,transparent 1px 6.25%)}
.bt-scale.sx .t3{height:14px;background:repeating-linear-gradient(90deg,var(--w-ink) 0 1px,transparent 1px 25%)}
.bt-scale.sx .t2{height:22px;background:repeating-linear-gradient(90deg,var(--w-ink) 0 1px,transparent 1px 100%)}
.bt-needle{transition:left .06s steps(1)}
.bt-trig{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bt-trig .gp{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.bt-trig .tk{display:flex;flex-direction:column;align-items:center;gap:8px}
.bt-trig .tk i{width:6px;height:6px;border-radius:50%;background:var(--lamp-off);transition:background .05s,box-shadow .05s}
.bt-trig .tk.on i{background:var(--lamp);box-shadow:0 0 7px var(--lamp)}
.bt-trig .tk b{display:block;width:100%;height:clamp(48px,9vh,70px);border-radius:2px;background:var(--key);box-shadow:inset 0 1px 0 var(--key-top),0 2px 0 var(--key-sh);transition:transform .04s}
.bt-trig .tk.f b{box-shadow:inset 0 1px 0 var(--key-top),0 2px 0 var(--key-sh),inset 0 -3px 0 color-mix(in srgb,var(--lamp) 55%,transparent)}
.bt-trig .tk.ph b{background:var(--key-top)}
.bt-trig .tk.dn b{transform:translateY(2px);box-shadow:inset 0 1px 0 var(--key-top)}
#boot.v6 .bt{gap:clamp(18px,4vh,34px)}
#boot.v7 .bt-dial{height:clamp(96px,15vh,130px)}
#boot.v7 .bt-led{top:34px}
.bt-gen{position:absolute;left:22px;right:22px;top:44px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--w-ink)}
.bt-gen svg{display:block;height:100%;width:auto;max-width:100%}
.bt-gd{position:absolute;left:22px;right:22px;bottom:22px;display:flex;justify-content:space-between}
.bt-gd i{width:8px;height:8px;border-radius:50%;background:var(--w-ink);opacity:.16}
.bt-gd i.on{opacity:.85}.bt-gd i.ph{opacity:1;background:var(--lamp);box-shadow:0 0 7px var(--lamp)}

/* ===== desktop and tablet: sequencer workspace ===== */
@media (min-width:900px){
  .mod>.card{position:sticky;top:var(--stk,170px);max-height:calc(100vh - var(--stk,170px) - 16px);overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}
  #chips,#ggen{grid-template-columns:repeat(4,minmax(0,1fr))}
  #chips .chip,#ggen .key{font-size:11px;letter-spacing:.06em;padding-left:4px;padding-right:4px}
  .pc{height:clamp(32px,4.8vh,48px)}
  .prow .pl{min-height:clamp(32px,4.8vh,48px)}
  .acts{grid-template-columns:repeat(4,minmax(0,1fr))}
  .acts .key.wide{grid-column:1/-1}
  .fid-in{max-width:620px}
  .trig .tk b{height:clamp(54px,9vh,92px)}
}
@media (min-width:900px) and (max-width:1100px){.mod{grid-template-columns:minmax(300px,360px) minmax(0,1fr)}}
@media (min-width:1500px){.device{max-width:1320px}}
@media (hover:hover){.pc:hover{box-shadow:inset 0 0 0 2px var(--ink)}.tk:hover b{filter:brightness(1.06)}}
@media (min-width:900px){#boot .bt-mx .bt-grid{max-width:min(100%,calc(34vh*1.9));margin:0 auto}}
@media (min-width:700px) and (min-height:700px){.bt{zoom:1.1}}
.kbd{display:none}@media (hover:hover) and (min-width:900px){.kbd{display:block}}

/* ===== boot: the app prints the pattern card ===== */
.bt-pr{position:relative}
.bt-pw{height:clamp(250px,40vh,400px);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;padding:0 6%}
.bt-paper{position:relative;width:100%;max-width:420px;background:#E9E9E3;color:#161716;padding:12px 24px 18px;display:flex;flex-direction:column;gap:7px;box-shadow:0 0 0 1px rgba(0,0,0,.14),0 8px 18px -10px rgba(0,0,0,.5);
  border-top:2px dashed rgba(0,0,0,.28);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.bt-paper:empty{display:none}
.bt-paper::before,.bt-paper::after{content:"";position:absolute;top:0;bottom:0;width:10px;background:radial-gradient(circle,#B9BAB4 0 2px,transparent 2.4px) 50% 0/10px 14px repeat-y}
.bt-paper::before{left:4px}.bt-paper::after{right:4px}
#boot.lock .bt-paper{transform:translateY(-10px)}
.bt-paper .ln{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:10px}
.bt-paper .ln[hidden]{display:none}
.bt-paper .ln svg{display:block;height:11px;width:auto;color:#161716}
.bt-paper .l2{margin:3px 0 3px}.bt-paper .l2 svg{height:21px}
.bt-paper .l1 svg,.bt-paper .l3 svg,.bt-paper .l4 svg{opacity:.75}
.bt-paper .l4{margin-top:3px;border-top:1px solid rgba(0,0,0,.2);padding-top:7px}
.bt-paper .tr .tl{flex:0 0 74px}.bt-paper .tr .tl svg{height:8px}
.bt-paper .dd{flex:1;display:flex;justify-content:space-between}
.bt-paper .dd i{width:7px;height:7px;border-radius:50%;background:#161716;opacity:.14}
.bt-paper .dd i.q{margin-left:3px}
.bt-paper .dd i.g{opacity:.38}.bt-paper .dd i.n{opacity:1}
.bt-paper .dd i.a{opacity:1;background:var(--lamp);box-shadow:0 0 0 1.5px rgba(0,0,0,.18)}
.bt-slot{position:relative;z-index:2;height:14px;margin:-1px 3% 0;border-radius:2px;background:#0F100F;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 1px 0 rgba(0,0,0,.4);display:flex;align-items:center;padding:0 10px}
.bt-slot span{margin-left:auto;font:500 8px/1 var(--f-mono);letter-spacing:.2em;color:#777}
.bt-sl{width:5px;height:5px;border-radius:50%;background:#333;transition:background .1s,box-shadow .1s}
#boot.prn .bt-sl{background:var(--lamp);box-shadow:0 0 6px var(--lamp)}
.bt-hd{position:absolute;top:2px;bottom:2px;left:0;width:14px;margin-left:-7px;background:var(--lamp);border-radius:1px;opacity:0;box-shadow:0 0 8px var(--lamp);transition:opacity .08s}
#boot.prn .bt-hd{opacity:.95}
@media (min-width:900px){.bt-pw{height:clamp(260px,36vh,360px)}}

.bt-grid i.fin{opacity:1;transition:opacity .15s}.bt-grid i.on.fin:not(.acc){background:var(--w-ink)}

#boot.k-pr .bt-mx,#boot.k-pr .bt-meter{display:none}
#boot.k-mx .bt-pr{display:none}
#boot.mxb.k-mx .bt-grid .r{transform-origin:50% 100%;transition:transform .32s cubic-bezier(.6,0,.4,1),opacity .32s}
#boot.fold.k-mx .bt-grid .r:not(:first-child){transform:scaleY(.04);opacity:0;transition-delay:calc((7 - var(--ri))*34ms)}
#boot.fold.k-mx .bt-grid .r:first-child{transform:scaleY(1.15);transition-delay:.3s}
#boot.fold.k-mx .bt-grid .r:first-child i.on{background:var(--lamp);box-shadow:0 0 10px var(--lamp);opacity:1}

@media print{
  .vt,.sec:has(.capb){display:none!important}
  .pg .pc{height:9mm!important}
  .sec{break-inside:avoid}
  .sheet::after{content:"SEQUENTIAL COMPANION · KIRILL KINDERHART";display:block;padding:8px 16px;font:400 9px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;border-top:1px solid #000}
}

  <main>

    this.burst(t,.018,'bandpass',1200*f,3,.09*v,out);
    this.tone(3100*f,t,.013,'sine',.02*v,2700*f,out);
  },
  tick(t,v,out,major){
    /* one tooth of a ratchet: the pawl drops onto a tooth. A tiny bright tick, with a firmer seat on accented teeth. */
    v=(v||1)*KT;
    const o=this.dest(out,(Math.random()-.5)*.22);
    this.burst(t,.0028,'highpass',4800,.7,.1*v,o);
    this.burst(t,.006,'bandpass',3300*(1+(Math.random()-.5)*.06),6,.2*v,o);
    this.tone(2050,t,.008,'triangle',.022*v,1500,o);
    if(major){this.burst(t,.014,'bandpass',1700,4,.1*v,o);this.tone(520,t,.02,'sine',.03*v,330,o);}
  },
  spring(t,v,out){
    /* a high spring released: inharmonic bright partials ringing down fast, plus a hiss of strand noise */
    v=(v||1)*KS;
    const o=this.dest(out,(Math.random()-.5)*.4),r=1+(Math.random()-.5)*.05;
    this.burst(t,.012,'highpass',8000,.7,.07*v,o);

      this.tone(x[0]*r,t,x[2],'sine',.03*x[1]*v,x[0]*r*.97,o);

  },
  wheel(t,dir,n,T){
    for(let i=0;i<n;i++){

  play(n,a){
    if(!this.ok())return;
    const c=this.ctx,t=c.currentTime+.004;
    switch(n){
      case 'kdown':this.click(t,{v:1});break;
      case 'kup':this.click(t,{v:.5,f:1.25});break;
      case 'pdown':this.click(t,{v:1.25,f:.78});break;
      case 'pup':this.click(t,{v:.6,f:1.05});break;
      case 'wheel':this.wheel(t,a,9,.42);break;
      case 'gores':{
        /* wind a timer: a ratchet speeding up, a beat of tension, then the release */
        let ti=t;
        for(let i=0;i<14;i++){this.tick(ti,.7+i*.025,null,false);ti+=.075-i*.0035;}
        ti+=.06;this.click(ti,{v:1.3,f:.8});this.spring(ti+.004,1);break;}
      case 'ftick':this.tick(t,.95,null,!!a);break;
      case 'copy':this.click(t,{v:1.1,f:1.1});this.spring(t+.012,.7);break;
      case 'tap':this.click(t,{v:1,f:1.05});break;
      case 'sw':this.click(t,{v:.9,f:.9});this.click(t+.045,{v:.8,f:1.2});break;
      case 'slide':{const f=Math.min(1.6,Math.max(.7,(a||800)/800));this.tick(t,.45*f,null,false);break;}
    }
  },
};

/* sequencer sounds: every lit column of the new pattern ticks as it is written; a kick makes a lower knock */
SND.seqErase=function(){
  /* the pins retract: a quick falling run of soft low ticks, fading out */
  if(!this.ok())return;const t0=this.ctx.currentTime+.004,o=this.master;
  for(let i=0;i<14;i++){const t=t0+i*.017,k=1-i/16;this.burst(t,.006,'bandpass',1500-i*65,3.5,.075*k*KC,o);}
  this.tone(120,t0,.05,'sine',.05*KC,70,o);
};
SND.seqWrite=function(pat){
  /* write head: one relay pin per lit step, pitch climbing across the 16 columns, a solenoid knock on kick steps, a latch at the end */
  if(!this.ok()||!pat)return;const t0=this.ctx.currentTime+.012,S=.044,o=this.master;
  for(let col=0;col<16;col++){
    const t=t0+col*S;let hits=0,acc=false,kick=false;
    pat.tracks.forEach((tr,i)=>{const v=tr.steps[col].v;if(v){hits++;if(v>=110)acc=true;if(i===0)kick=true;}});
    const f=2200+col*170;
    if(kick){this.tone(150,t,.055,'sine',.12*KC,60,o);this.burst(t,.004,'highpass',3800,.7,.12*KC,o);}
    if(hits>(kick?1:0)){
      this.burst(t,.005,'highpass',f*1.7,.8,(.07+hits*.012)*KC*(acc?1.5:1),o);
      this.burst(t+.001,.011,'bandpass',f,6,(.09+hits*.012)*KC,o);
    }else if(!kick&&col%4===0)this.burst(t,.004,'bandpass',f*.7,4,.04*KC,o);
  }
  const tl=t0+16*S+.035;
  this.tone(95,tl,.09,'sine',.2*KC,48,o);this.burst(tl,.006,'highpass',4200,.7,.14*KC,o);
  this.burst(tl+.05,.004,'highpass',5600,.7,.1*KC,o);this.burst(tl+.05,.014,'bandpass',2400,5,.1*KC,o);
};
SND.modeSw=function(dir){
  /* stepping selector: three relay clacks climbing or falling in pitch, a soft thud under the last one */
  if(!this.ok())return;const t0=this.ctx.currentTime+.004,o=this.master,d=dir<0?-1:1;

{const _play=SND.play;SND.play=function(n,a){if(n==='wheel'){if(this.ok())this.modeSw(a||1);return;}return _play.call(this,n,a);};}
SND.bootSeq=function(pat,STEP,TL){
  const c=this.ctx,t0=c.currentTime+.05,bus=c.createGain();bus.gain.value=1;bus.connect(this.master);this.bus=bus;
  this.click(t0,{v:1.1,f:.8,out:bus});
  for(let n=0;n<32;n++){
    const col=n%16,ti=t0+n*STEP;let hits=0,acc=false,kick=false;
    pat.tracks.forEach((tr,i)=>{const v=tr.steps[col].v;if(v){hits++;if(v>=110)acc=true;if(i===0)kick=true;}});
    if(kick)this.click(ti,{v:n<16?.45:.7,f:.7,out:bus});
    if(hits>(kick?1:0))this.tick(ti+.002,(.7+hits*.08)*(n<16?1:1.3),bus,acc||col%4===0);
    else if(!kick&&col%4===0)this.tick(ti,.4,bus,true);
  }
  const tl=t0+TL;this.click(tl,{v:1.4,f:.7,out:bus});this.spring(tl+.004,1,bus);
};
SND.bootPrint=function(sched,TL){
  /* dot-matrix card printer: a buzzing run of pin hits per line, a line feed at the end of each, a tear-off clunk at the end */
  const c=this.ctx,t0=c.currentTime+.05,bus=c.createGain();bus.gain.value=1;bus.connect(this.master);this.bus=bus;
  this.click(t0,{v:1.1,f:.8,out:bus});

    const n=Math.max(3,Math.round(q.d/.0105));
    for(let k=0;k<n;k++){
      const t=t0+q.s+k*(q.d/n);
      this.burst(t,.0035,'highpass',3200+Math.random()*1800,.8,.05*KC,bus);
      if(k%2===0)this.burst(t,.007,'bandpass',1900+Math.random()*500,4,.05*KC,bus);
    }
    this.click(t0+q.s+q.d+.012,{v:.5,f:.55,out:bus});

/* ---------- pattern analysis ---------- */
function analyse(p){
  let tot=0;const cl=[],pl=[];
  p.tracks.forEach((tr,ti)=>tr.steps.forEach((s,si)=>{if(s.v)tot++;if(s.c)cl.push([ti,si,s.c]);if(s.p)pl.push([ti,si,s.p]);}));
  return{tot,dens:Math.round(tot/1.28),cl,pl};
}
function ensurePat(p){if(!p.vars){p.tracks=p.tracks;finish(p,null,p.id||p.name);}else p.tracks=p.vars[p.var||'A'];return p;}
/* ---------- MIDI file: A A B FILL, one MIDI channel per track, note C4, 96 PPQ ---------- */
function makeMidi(p){
  const PPQ=96,ST=24,ev=[];
  const vl=n=>{const b=[n&127];while((n>>=7)>0)b.unshift((n&127)|128);return b;};
  const A=p.vars?p.vars.A:p.tracks,B=p.vars?p.vars.B:p.tracks,F=p.vars?p.vars.FILL:p.tracks,seq=[A,A,B,F];
  const sw=Math.round(((p.sw||50)-50)/100*ST*2);
  seq.forEach((tracks,bar)=>tracks.forEach((tr,ti)=>{
    const len=(p.len&&p.len[ti])||16;
    for(let i=0;i<16;i++){
      const s=tr.steps[(i%len)];if(!s||!s.v)continue;
      let tk=(bar*16+i)*ST+(i%2?sw:0)+((p.mt&&p.mt[ti])||0);if(tk<0)tk=0;
      ev.push([tk,0x90|ti,60,Math.min(127,s.v)]);ev.push([tk+12,0x80|ti,60,0]);
    }
  }));
  ev.sort((x,y)=>x[0]-y[0]||(x[3]===0?-1:1));
  const trk=[];
  const meta=(d,type,data)=>{trk.push(...vl(d),0xFF,type,...vl(data.length),...data);};
  const nm=Array.from('SC '+p.name).map(c=>c.charCodeAt(0)&127);
  meta(0,3,nm);
  const mpq=Math.round(60000000/p.bpm);meta(0,0x51,[mpq>>16&255,mpq>>8&255,mpq&255]);
  meta(0,0x58,[4,2,24,8]);
  let last=0;ev.forEach(e=>{trk.push(...vl(e[0]-last),e[1],e[2],e[3]);last=e[0];});
  meta(Math.max(0,4*16*ST-last),0x2F,[]);
  const hdr=[0x4D,0x54,0x68,0x64,0,0,0,6,0,0,0,1,PPQ>>8,PPQ&255];
  const L=trk.length,tc=[0x4D,0x54,0x72,0x6B,L>>>24&255,L>>>16&255,L>>>8&255,L&255];
  return new Uint8Array([...hdr,...tc,...trk]);
}
function downloadMidi(p){
  if(!p)return;
  const blob=new Blob([makeMidi(p)],{type:'audio/midi'}),u=URL.createObjectURL(blob),an=document.createElement('a');
  an.href=u;an.download=`${String(p.name).replace(/[^A-Za-z0-9]+/g,'-')}-${p.bpm}bpm.mid`;document.body.appendChild(an);an.click();an.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);toast(t('ok_midi'));
}
const sym=v=>v>=110?'X':v>=80?'x':v>0?'o':'.';
function asText(p){
  const a=analyse(p);
  let s=`SEQUENTIAL COMPANION · DIGITAKT 2 · PATTERN CARD\n${p.name.toUpperCase()}  [${p.genre}]  ${p.bpm} BPM  SWING ${p.sw}%  ID ${p.id}\n\n`;
  s+='         1    5    9    13   Σ\n';
  p.tracks.forEach((tr,ti)=>{let l='';for(let q=0;q<4;q++)l+=tr.steps.slice(q*4,q*4+4).map(x=>sym(x.v)).join('')+' ';
    s+=`T${ti+1} ${tr.name.padEnd(6)} ${l} ${tr.steps.filter(x=>x.v).length}\n`;});
  s+=`\nKEY ${p.key||'-'} · VARIATION ${p.var||'A'}\nMICRO ${p.tracks.map((tr,ti)=>'T'+(ti+1)+' '+mtFmt((p.mt||[])[ti]|0)).join(' ')}`+(p.len&&p.len.some(l=>l<16)?`\nLEN ${p.tracks.map((tr,ti)=>p.len[ti]<16?'T'+(ti+1)+' '+p.len[ti]:'').filter(Boolean).join(' ')}`:'')+'\n';
  s+=`\nTRIGS ${a.tot}/128 · DENSITY ${a.dens}% · CONDITIONS ${a.cl.length} · P-LOCKS ${a.pl.length}\n`;
  s+='X accent  x normal  o ghost  . off\n\nCONDITIONS\n'+(a.cl.map(([ti,si,c])=>`  T${ti+1} ${p.tracks[ti].name} S${si+1}: ${c}`).join('\n')||'  -')+'\n\nP-LOCKS\n'+(a.pl.map(([ti,si,x])=>`  T${ti+1} ${p.tracks[ti].name} S${si+1}: ${x.n} ${x.v}`).join('\n')||'  -')+'\n';
  return s;
}

function show(m){
  state.mode=m;
  $('#p-lib').hidden=m!=='lib';$('#p-gen').hidden=m!=='gen';
  $$('.bar [data-a=mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===m)));
  $$('.dial .dl').forEach(l=>l.classList.toggle('on',l.dataset.m===m));
  $('#dial').style.setProperty('--pos',POS[m]+'%');
  if(m==='lib')loadLib();else{if(!state.pat||state.pat.id.startsWith('LIB'))regen();else regen();}
  if(m==='gen'){const gi=curGi();state.pat.id=mkCode(gi,state.seed);}
  state.cardNo=state.count;
  $(m==='lib'?'#genOut':'#libOut').innerHTML='';
  renderSheet(true);syncUI();store();window.scrollTo(0,0);
}

/* ---------- fire (go button): the old pattern is wiped column by column, then the new one is written step by step ---------- */
let busy=false;
const COL=44; /* ms per step, keep in sync with the CSS animation delays */
function fire(btn,o,fn){
  if(busy)return;busy=true;
  $('#lamp').classList.add('on');$('#dial').classList.add('scan');
  if(btn)btn.classList.add('busy');
  const sh=o&&$('.sheet',o);
  if(sh&&!RM){sh.classList.remove('wr');sh.classList.add('er');SND.seqErase();}
  if(btn&&!RM){
    let sq=btn.querySelector('.seq');
    if(!sq){sq=document.createElement('span');sq.className='seq';sq.setAttribute('aria-hidden','true');sq.innerHTML='<i></i>'.repeat(16);btn.appendChild(sq);}
    const st=[...sq.children];st.forEach(x=>x.classList.remove('on'));
    const go=()=>st.forEach((x,i)=>setTimeout(()=>{st.forEach(y=>y.classList.remove('on'));x.classList.add('on');},300+i*COL));
    go();
    setTimeout(()=>st.forEach(y=>y.classList.remove('on')),300+16*COL+60);
  }
  setTimeout(()=>{
    fn();SND.seqWrite(state.pat);
    const oo=out(),stick=$('.stick'),sh2=stick?stick.offsetHeight:0;
    if(oo){const top=oo.getBoundingClientRect().top;if(top>innerHeight*.6||top<sh2)window.scrollTo({top:Math.max(0,scrollY+top-12-sh2),behavior:RM?'auto':'smooth'});}
  },RM?0:300);
  setTimeout(()=>{$('#lamp').classList.remove('on');$('#dial').classList.remove('scan');if(btn)btn.classList.remove('busy');busy=false;},RM?30:300+16*COL+320);
}

/* ---------- PNG ---------- */
function drawPNG(){
  const p=state.pat,a=analyse(p),W=1200,nrow=Math.max(1,Math.min(5,a.cl.length+(a.cl.length>5?1:0),9),Math.min(5,a.pl.length)+(a.pl.length>5?1:0)),H=240+8*68+26+34+nrow*22+90,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const paper='#E2E3E0',ink='#1A1B1A',dim='#575A56',line='#A6A8A4',lamp='#E8461B',key='#EDEEEB',scr='#131413',F='"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace';
  x.fillStyle='#D4D5D2';x.fillRect(0,0,W,H);x.fillStyle=paper;x.fillRect(30,30,W-60,H-60);x.strokeStyle=line;x.lineWidth=2;x.strokeRect(30,30,W-60,H-60);
  x.fillStyle=scr;x.fillRect(30,30,W-60,150);
  x.fillStyle='#9A9D98';x.font=`500 15px ${F}`;x.fillText(`${t('card_no').toUpperCase()} ${pad(state.cardNo||state.count,4)} · ${p.id}`,60,66);
  x.textAlign='right';x.fillText(p.genre,W-60,66);x.textAlign='left';
  x.fillStyle='#E6E7E3';x.font=`600 44px ${F}`;x.fillText(p.name.toUpperCase(),60,122);
  x.fillStyle='#9A9D98';x.font=`400 18px ${F}`;x.fillText(`${p.bpm} BPM · SWING ${p.sw}% · TRIGS ${a.tot}/128 · DENSITY ${a.dens}%`,60,158);
  const gx=200,cw=48,ch=58,gap=4,grp=22,gy=240;
  x.font=`500 13px ${F}`;x.fillStyle=dim;[...Array(16)].forEach((_,i)=>x.fillText(i+1,gx+i*(cw+gap)+Math.floor(i/4)*grp+cw/2-(i>8?8:4),gy-14));
  x.textAlign='right';x.fillText('Σ',W-60,gy-14);x.textAlign='left';
  p.tracks.forEach((tr,ti)=>{
    const y=gy+ti*(ch+10);x.fillStyle=dim;x.font=`500 13px ${F}`;x.fillText('T'+(ti+1),60,y+22);x.fillStyle=ink;x.font=`600 16px ${F}`;x.fillText(tr.name,60,y+44);
    tr.steps.forEach((s,si)=>{const px=gx+si*(cw+gap)+Math.floor(si/4)*grp;
      x.fillStyle=key;x.fillRect(px,y,cw,ch);
      if(s.v){const h=s.v>=110?ch:s.v>=80?ch*.68:ch*.34;x.fillStyle=ink;x.fillRect(px,y+ch-h,cw,h);if(s.v>=110){x.fillStyle=lamp;x.fillRect(px,y,cw,5);}}
      x.strokeStyle=s.v?ink:line;x.lineWidth=2;x.strokeRect(px+1,y+1,cw-2,ch-2);
      if(s.c){x.fillStyle=lamp;x.beginPath();x.moveTo(px+cw-2,y+ch-2);x.lineTo(px+cw-2,y+ch-14);x.lineTo(px+cw-14,y+ch-2);x.fill();}
      if(s.p){x.save();x.translate(px+10,y+12);x.rotate(Math.PI/4);x.fillStyle=paper;x.strokeStyle=ink;x.lineWidth=2;x.fillRect(-4,-4,8,8);x.strokeRect(-4,-4,8,8);x.restore();}
    });
    x.fillStyle=ink;x.font=`600 18px ${F}`;x.textAlign='right';x.fillText(tr.steps.filter(s=>s.v).length,W-60,y+36);x.textAlign='left';
  });
  const ny=gy+8*(ch+10)+26;x.fillStyle=ink;x.fillRect(60,ny-16,W-120,2);
  x.fillStyle=dim;x.font=`600 13px ${F}`;x.fillText(t('s_cond').toUpperCase(),60,ny+8);x.fillText(t('s_pl').toUpperCase(),640,ny+8);
  x.fillStyle=ink;x.font=`500 15px ${F}`;
  a.cl.slice(0,5).forEach(([ti,si,cn],i)=>x.fillText(`T${ti+1} ${p.tracks[ti].name} · S${si+1} · ${cn}`,60,ny+34+i*22));
  a.pl.slice(0,5).forEach(([ti,si,q],i)=>x.fillText(`T${ti+1} ${p.tracks[ti].name} · S${si+1} · ${q.n} ${q.v}`,640,ny+34+i*22));
  if(a.cl.length>5)x.fillText(`+${a.cl.length-5}`,60,ny+34+5*22);if(a.pl.length>5)x.fillText(`+${a.pl.length-5}`,640,ny+34+5*22);
  const dm=(s,px,py,d)=>{let ox=px;for(const ch of s){const g=DF[ch];if(!g)continue;g.split(' ').forEach((row,r)=>{for(let k=0;k<5;k++)if(row[k]==='1'){x.beginPath();x.arc(ox+k*d,py+r*d,d*.38,0,7);x.fill();}});ox+=6*d;}};
  x.fillStyle=ink;dm(MARK,60,H-76,5);x.fillStyle=dim;dm('SEQUENTIAL COMPANION',130,H-76,2.6);
  x.font=`400 12px ${F}`;x.textAlign='right';x.fillText(`${p.id} · ${p.bpm} BPM · KIRILL KINDERHART`,W-60,H-52);x.textAlign='left';
  return c;
}
function savePNG(){
  drawPNG().toBlob(async b=>{
    if(!b){toast(t('fail_copy'));return;}
    const name=`sequential-companion-${state.pat.id}.png`,file=new File([b],name,{type:'image/png'});
    try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:state.pat.name});return;}}catch(e){if(e&&e.name==='AbortError')return;}
    const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast(t('ok_png'));
  },'image/png');

const MODES_ORDER=['lib','gen'];
function sfxFor(a){
  if(a==='var')return 'tap';
  if(a==='roll'||a==='lib-rnd')return '';
  if(a==='mode')return 'wheel';
  if(a==='copy'||a==='save'||a==='svcopy'||a==='seedcopy')return 'copy';
  return '';
}
let downEl=null;
const isBig=b=>b.classList.contains('go');
document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('[data-a]');if(!b||b.disabled)return;downEl=b;SND.play(isBig(b)?'pdown':'kdown');},true);
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{if(!downEl)return;const b=downEl;downEl=null;SND.play(isBig(b)?'pup':'kup');},true));
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,fn=ACT[a];if(!fn)return;
  if(e.detail===0&&a!=='snd'){SND.play(isBig(b)?'pdown':'kdown');setTimeout(()=>SND.play(isBig(b)?'pup':'kup'),70);}
  const sn=sfxFor(a);
  if(sn){
    let arg;if(a==='mode'){const d=MODES_ORDER.indexOf(b.dataset.v)-MODES_ORDER.indexOf(state.mode);arg=d===0?0:(d>0?1:-1);}
    if(sn!=='wheel'||arg)SND.play(sn,arg);
  }
  fn(b,e);
});
let lastSl=0;
document.addEventListener('input',e=>{
  const r=e.target;if(!r.matches||!r.matches('input[data-k]'))return;
  const k=r.dataset.k;state.opts[k]=+r.value;$('#v_'+k).textContent=r.value;
  const n=performance.now();if(n-lastSl>45){lastSl=n;SND.play('slide',500+(+r.value)*90);}

$('#seed').addEventListener('change',e=>{
  const p=parseCode(e.target.value);
  if(!p){toast(t('bad_seed'));e.target.value=mkCode(curGi(),state.seed);return;}
  state.genre=GENRES[p.gi];state.seed=p.seed%MAXSEED;regen();newCard();

$('#seed').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#sv').hidden){closeSv();return;}
  if(e.metaKey||e.ctrlKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||''))||$('#boot')||FID.open||!$('#sv').hidden)return;
  const k=e.key.toLowerCase(),has=!!state.pat;
  if(k==='1')show('lib');else if(k==='2')show('gen');else if(k==='3')ACT.saved();
  else if(k==='m')ACT.snd();
  else if(k==='g'||k===' '){e.preventDefault();const b=$(state.mode==='lib'?'[data-a=lib-rnd]':'[data-a=roll]');if(b)b.click();}
  else if(k==='arrowright')(state.mode==='lib'?ACT.next:ACT['seed+'])();
  else if(k==='arrowleft')(state.mode==='lib'?ACT.prev:ACT['seed-'])();
  else if(has&&(k==='a'||k==='b'||k==='f'))ACT.var({dataset:{v:k==='f'?'FILL':k.toUpperCase()}});
  else if(has&&k==='s')ACT.save();
  else if(has&&k==='e')ACT.midi();
  else if(has&&k==='c')ACT.copy();
});


/* ---------- header dial: a tiny live view of the current pattern with a running playhead ---------- */
(function(){
  const cv=$('#dialMx');if(!cv)return;
  const cx=cv.getContext('2d');let W=0,H=0,pos=-1,tm=0,demo=null;
  function size(){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);W=Math.round(r.width*d);H=Math.round(r.height*d);cv.width=W;cv.height=H;draw();}
  function draw(){
    const cs=getComputedStyle(document.documentElement),ink=cs.getPropertyValue('--ink').trim()||'#111',dim=cs.getPropertyValue('--ink2').trim()||'#888',lamp=cs.getPropertyValue('--lamp').trim()||'#E8461B';
    cx.clearRect(0,0,W,H);if(!W)return;
    const pat=state.pat||(demo||(demo=gen('TECHNO',1234,{density:6,chaos:2,conds:0,plocks:0},Array(8).fill(false),null)));
    const colW=W/16,rowH=H/8,r=Math.min(colW,rowH)*.33;
    for(let c=0;c<16;c++){
      if(c===pos){cx.globalAlpha=.16;cx.fillStyle=lamp;cx.fillRect(c*colW+colW*.1,0,colW*.8,H);}
      for(let t=0;t<8;t++){
        const v=pat.tracks[t].steps[c].v,x=c*colW+colW/2,y=t*rowH+rowH/2;
        cx.beginPath();cx.arc(x,y,v?r*1.25:r*.7,0,7);
        if(!v){cx.globalAlpha=.28;cx.fillStyle=dim;}
        else if(c===pos){cx.globalAlpha=1;cx.fillStyle=lamp;}
        else{cx.globalAlpha=v>=110?1:v>=80?.75:.5;cx.fillStyle=ink;}
        cx.fill();
      }
    }
    cx.globalAlpha=1;
  }
  function tick(){
    pos=(pos+1)%16;draw();
    const fast=$('#dial').classList.contains('scan'),bpm=(state.pat&&state.pat.bpm)||120;
    tm=setTimeout(tick,fast?COL:Math.max(90,Math.min(220,15000/bpm)));
  }
  addEventListener('resize',size);
  document.addEventListener('visibilitychange',()=>{clearTimeout(tm);if(!document.hidden&&!RM)tick();});
  new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['data-skin','class']});
  size();if(RM){pos=-1;}else tick();
  window.__scDial=draw;
})();


/* ---------- fidget: tap steps into a 8x16 pad, spin the encoder to rotate the pattern, run the playhead for mechanical ticks ---------- */
const FID={sel:0,open:false,g:Array.from({length:8},()=>Array(16).fill(0)),pos:-1,run:true,tm:0,raf:0,paint:null};
(function(){
  const grid=$('#fGrid'),cells=[];
  for(let r=0;r<8;r++)for(let c=0;c<16;c++){const d=document.createElement('i');d.className='r'+r;d.dataset.r=r;d.dataset.c=c;grid.appendChild(d);cells.push(d);}
  const lit=()=>FID.g.reduce((n,r)=>n+r.reduce((m,x)=>m+x,0),0);
  function paint(){
    cells.forEach(d=>{const r=+d.dataset.r,c=+d.dataset.c;d.classList.toggle('on',!!FID.g[r][c]);d.classList.toggle('ph',c===FID.pos);});
    $('#fCnt').textContent=pad(lit(),3);if(FID.pk)FID.pk();
  }
  FID.paint=paint;
  function seed(){const p=gen(GENRES[Math.floor(Math.random()*GENRES.length)],Math.floor(Math.random()*MAXSEED),{density:6,chaos:3,conds:0,plocks:0},Array(8).fill(false),null);FID.g=p.tracks.map(t=>t.steps.map(s=>s.v?1:0));}
  FID.seed=seed;
  function hit(col,vol){
    if(!SND.ok())return;const t=SND.ctx.currentTime+.004;let n=0,k=0;
    for(let r=0;r<8;r++)if(FID.g[r][col]){n++;if(r===0)k=1;}
    if(k)SND.click(t,{v:.7*vol,f:.75});
    if(n>k)SND.tick(t+.002,(.7+n*.08)*vol,null,col%4===0);
  }
  function step(){
    if(!FID.open)return;
    FID.pos=(FID.pos+1)%16;paint();hit(FID.pos,1);
    FID.tm=setTimeout(step,125);
  }
  FID.go=()=>{clearTimeout(FID.tm);if(FID.run&&FID.open&&!RM)step();else{FID.pos=-1;paint();}};
  /* tap and drag-paint */
  let mode=null;
  const at=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.parentNode===grid?el:null;};
  grid.addEventListener('pointerdown',e=>{const d=at(e);if(!d)return;e.preventDefault();grid.setPointerCapture(e.pointerId);const r=+d.dataset.r,c=+d.dataset.c;FID.sel=r;mode=FID.g[r][c]?0:1;FID.g[r][c]=mode;paint();if(SND.ok()){SND.click(SND.ctx.currentTime+.003,{v:mode?1:.7,f:mode?1.15:.9});}});
  grid.addEventListener('pointermove',e=>{if(mode===null)return;const d=at(e);if(!d)return;const r=+d.dataset.r,c=+d.dataset.c;if(FID.g[r][c]===mode)return;FID.g[r][c]=mode;paint();if(SND.ok())SND.tick(SND.ctx.currentTime+.002,.8,null,false);});
  const end=()=>{mode=null;};grid.addEventListener('pointerup',end);grid.addEventListener('pointercancel',end);
  /* trig keys: sixteen rubber keys act on the selected row, LEDs show its steps */
  const NM=['KICK','SNARE','CLAP','HAT C','HAT O','PERC','BASS','FX'],tk=$('#fTrig');
  for(let c=0;c<16;c++){const k=document.createElement('button');k.type='button';k.className='tk';k.dataset.c=c;k.setAttribute('aria-label',(c+1)+'');k.innerHTML='<i></i><b></b>';if(c%4===0)k.classList.add('f');if(c%4===0){var gp=document.createElement('div');gp.className='gp';tk.appendChild(gp);}gp.appendChild(k);}
  const keys=[...tk.querySelectorAll('.tk')];
  FID.sel=0;
  function paintKeys(){keys.forEach((k,c)=>{k.classList.toggle('on',!!FID.g[FID.sel][c]);k.classList.toggle('ph',c===FID.pos);});$('#fTrn').textContent='T'+(FID.sel+1)+' · '+NM[FID.sel];cells.forEach(d=>d.classList.toggle('rs',+d.dataset.r===FID.sel));}
  FID.pk=paintKeys;
  tk.addEventListener('pointerdown',e=>{const k=e.target.closest('.tk');if(!k)return;const c=+k.dataset.c,r=FID.sel;FID.g[r][c]^=1;k.classList.add('dn');paint();if(SND.ok())SND.click(SND.ctx.currentTime+.003,{v:FID.g[r][c]?1:.7,f:FID.g[r][c]?1.05:.85});});
  const kup=e=>keys.forEach(k=>k.classList.remove('dn'));addEventListener('pointerup',kup);addEventListener('pointercancel',kup);
  FID.key=v=>{
    if(v==='run'){FID.run=!FID.run;$('#fKeys [data-v=run]').setAttribute('aria-pressed',String(FID.run));FID.go();}
    else if(v==='rnd'){seed();paint();}
    else if(v==='inv'){FID.g=FID.g.map(r=>r.map(x=>1-x));paint();}
    else if(v==='clr'){FID.g=FID.g.map(r=>r.map(()=>0));paint();}
  };
  /* triple-tap on the logo */
  let mk=[];
  $('.mark').addEventListener('click',()=>{const n=performance.now();mk=mk.filter(x=>n-x<1400);mk.push(n);if(mk.length>=3){mk=[];openFid();}});
})();
function openFid(){

}
function closeFid(){

/* ---------- boot screen: the app writes a pattern into an 8x16 LED matrix, plays it once, then the dots fold into the SC mark ---------- */
function runBootMx(){
  const el=$('#boot'),dev=$('.device');if(!el)return;
  const STEP=.075,T2=32*STEP,TM=.022,TL=T2+16*TM+.05,FOLD=TL+.45,BTOTAL=FOLD+.6;
  const pat=gen(GENRES[Math.floor(Math.random()*GENRES.length)],Math.floor(Math.random()*MAXSEED),{density:6,chaos:2,conds:0,plocks:0},Array(8).fill(false),null);
  const grid=$('#btGrid'),dots=[],segs=$$('#btSeg i'),big=$('#btBig'),st=$('#btSt'),pw=$('#btPwrT'),uR=$('#btU'),V=(r,c)=>pat.tracks[r].steps[c].v;
  for(let r=0;r<8;r++){const row=document.createElement('div');row.className='r';row.style.setProperty('--ri',r);for(let c=0;c<16;c++){const d=document.createElement('i');row.appendChild(d);dots.push(d);}grid.appendChild(row);}
  const setBig=s=>{big.innerHTML=dotSvg(s,4,1.6);big.setAttribute('aria-label',s);};
  setBig('---');
  let starting=false,started=false,ended=false,locked=false,tStart=0,auto=0,safety=0,lastF=-1,lastBpm=false;
  try{dev.inert=true;}catch(e){}
  document.documentElement.style.overflow='hidden';
  const setT=(node,key)=>{node.dataset.t=key;node.textContent=t(key);};
  function paint(tt){
    const n=Math.floor(tt/STEP);
    for(let r=0;r<8;r++)for(let c=0;c<16;c++){
      let cls='';const v=V(r,c);
      {
        const written=n>=16||c<=n;
        if(written&&v)cls=v>=110?'on acc':'on';
        if(tt>=T2&&tt>=T2+c*TM&&v)cls+=' fin';
        if(n<32&&c===n%16){cls+=' ph';if(n>=16&&v)cls+=' hit';}
      }
      const d=dots[r*16+c];if(d._c!==cls){d.className=cls;d._c=cls;}
    }
    const idx=n<32?n%16:-1;
    if(!locked)segs.forEach((x,i)=>x.classList.toggle('on',i===idx));
  }
  function lcd(tt){
    if(locked)return;
    if(tt<16*STEP){const f=Math.floor(tt/.055);if(f!==lastF){lastF=f;setBig(pad(Math.floor(Math.random()*1000),3));}}
    else if(!lastBpm){lastBpm=true;setBig(String(pat.bpm));uR.textContent=pat.genre;$('#lTun').classList.add('lit');}
  }
  function lock(){
    locked=true;el.classList.add('lock');
    segs.forEach((x,i)=>{x.classList.add('on');x.classList.toggle('hot',i>=13);});
    setBig(MARK);setT(st,'boot_lock');
  }
  function finish(){
    if(ended)return;ended=true;
    clearTimeout(auto);clearTimeout(safety);
    window.removeEventListener('keydown',onKey,true);
    SND.bootStop();
    el.classList.add('out');
    try{dev.inert=false;}catch(e){}
    dev.removeAttribute('inert');
    document.documentElement.style.overflow='';
    window.scrollTo(0,0);
    setTimeout(()=>{el.remove();},700);
  }
  function frame(now){
    if(ended)return;
    const tt=(now-tStart)/1000;
    paint(tt);lcd(tt);
    if(!locked&&tt>=T2+16*TM)lock();
    if(!el.classList.contains('fold')&&tt>=FOLD)el.classList.add('fold');
    if(tt>=BTOTAL){finish();return;}
    requestAnimationFrame(frame);
  }
  function begin(){
    started=true;clearTimeout(auto);
    safety=setTimeout(finish,12000);
    el.classList.add('on','run');
    setT(pw,'boot_skip');setT(st,'boot_wr');
    if(RM){paint(T2+1);lock();setTimeout(finish,700);return;}
    el.classList.add('mxb');
    if(SND.ok()){try{SND.bootSeq(pat,STEP,TL);}catch(e){}}
    else if(SND.on&&SND.ctx){try{SND.ctx.resume().then(()=>{if(!ended&&SND.ok())SND.bootSeq(pat,STEP,TL);}).catch(()=>{});}catch(e){}}
    tStart=performance.now();
    requestAnimationFrame(frame);
  }
  function start(){
    if(ended)return;
    if(started){if(performance.now()-tStart>600)finish();return;}
    if(starting)return;
    starting=true;
    SND.unlock();
    let done=false;
    const go=()=>{if(done)return;done=true;begin();};
    if(SND.on&&SND.ctx&&SND.ctx.state!=='running'){
      try{SND.ctx.resume().then(go,go);}catch(e){go();}
      setTimeout(go,350);
    }else go();
  }
  function onKey(e){
    if(e.metaKey||e.ctrlKey||e.altKey||e.key==='Tab'||e.key==='Shift')return;
    if(e.key==='Escape'){if(started)finish();else start();return;}
    if(e.target&&(e.target.id==='btPwr'||e.target.id==='btSnd')&&(e.key==='Enter'||e.key===' '))return;
    start();
  }
  el.addEventListener('click',e=>{if(e.target.closest('[data-a="snd"]'))return;start();});
  window.addEventListener('keydown',onKey,true);
  /* with sound on the browser only plays after a tap, so wait for the power key instead of starting silently */
  auto=setTimeout(()=>{if(!started&&!starting&&(!SND.on||SND.ok())){starting=true;begin();}},2800);
  try{$('#btPwr').focus({preventScroll:true});}catch(e){}
  paint(-1);
}

function runBootPr(){
  const el=$('#boot'),dev=$('.device');if(!el)return;
  const pat=gen(GENRES[Math.floor(Math.random()*GENRES.length)],Math.floor(Math.random()*MAXSEED),{density:6,chaos:2,conds:0,plocks:0},Array(8).fill(false),null);
  const paper=$('#btPaper'),head=$('#btHead'),big=$('#btBig'),st=$('#btSt'),pw=$('#btPwrT'),uR=$('#btU');
  /* the card, one printed line at a time: [html, start, duration] */
  const NM=['KICK','SNARE','CLAP','HAT C','HAT O','PERC','BASS','FX'],U=s=>String(s).toUpperCase().replace(/[^A-Z0-9. -]/g,' ');
  const L=[];
  L.push(['<div class="ln l1">'+dotSvg('CARD '+pad(state.count+1,4)+'  '+pat.id,1.5,.55)+'</div>',.12,.32]);
  L.push(['<div class="ln l2">'+dotSvg(U(pat.name),3,1.2)+'</div>',.5,.6]);
  L.push(['<div class="ln l3">'+dotSvg(U(pat.genre)+'  '+pat.bpm+' BPM  SWING '+pat.sw,1.5,.55)+'</div>',1.15,.3]);
  pat.tracks.forEach((tr,ti)=>{
    const dots=tr.steps.map((s,k)=>'<i class="'+(s.v>=110?'a':s.v>=80?'n':s.v>0?'g':'')+(k%4===0?' q':'')+'"></i>').join('');
    L.push(['<div class="ln tr"><span class="tl">'+dotSvg('T'+(ti+1)+' '+NM[ti],1.5,.55)+'</span><span class="dd">'+dots+'</span></div>',1.55+ti*.17,.16]);
  });
  L.push(['<div class="ln l4">'+dotSvg('KEY '+U(pat.key)+'  SC',1.5,.55)+'</div>',2.95,.3]);
  const els=L.map(([h])=>{const d=document.createElement('div');d.innerHTML=h;const n=d.firstChild;n.hidden=true;paper.appendChild(n);return n;});
  const sched=L.map(([,s,d])=>({s,d}));
  const TL=3.35,BTOTAL=4.1;
  let starting=false,started=false,ended=false,locked=false,tStart=0,auto=0,safety=0,lastF=-1,lastBpm=false;
  try{dev.inert=true;}catch(e){}
  document.documentElement.style.overflow='hidden';
  const setBig=s=>{big.innerHTML=dotSvg(s,4,1.6);big.setAttribute('aria-label',s);};
  setBig('---');
  const setT=(node,key)=>{node.dataset.t=key;node.textContent=t(key);};
  function paint(tt){
    let act=-1,ap=0;
    sched.forEach((q,i)=>{
      const n=els[i];
      if(tt>=q.s){
        if(n.hidden)n.hidden=false;
        const p=Math.min(1,(tt-q.s)/q.d);
        n.style.clipPath='inset(0 '+((1-p)*100).toFixed(1)+'% 0 0)';
        if(p<1){act=i;ap=p;}
      }
    });
    el.classList.toggle('prn',act>=0);
    head.style.left=(act>=0?(4+ap*92):0)+'%';
  }
  function lcd(tt){
    if(locked)return;
    if(tt<1.0){const f=Math.floor(tt/.055);if(f!==lastF){lastF=f;setBig(pad(Math.floor(Math.random()*1000),3));}}
    else if(!lastBpm){lastBpm=true;setBig(String(pat.bpm));uR.textContent=pat.genre;}
  }
  function lock(){locked=true;el.classList.add('lock');el.classList.remove('prn');setBig(MARK);setT(st,'boot_done');}
  function finish(){
    if(ended)return;ended=true;
    clearTimeout(auto);clearTimeout(safety);
    window.removeEventListener('keydown',onKey,true);
    SND.bootStop();
    el.classList.add('out');
    try{dev.inert=false;}catch(e){}
    dev.removeAttribute('inert');
    document.documentElement.style.overflow='';
    window.scrollTo(0,0);
    setTimeout(()=>{el.remove();},700);
  }
  function frame(now){
    if(ended)return;
    const tt=(now-tStart)/1000;
    paint(tt);lcd(tt);
    if(!locked&&tt>=TL)lock();
    if(tt>=BTOTAL){finish();return;}
    requestAnimationFrame(frame);
  }
  function begin(){
    started=true;clearTimeout(auto);
    safety=setTimeout(finish,12000);
    el.classList.add('on','run');
    setT(pw,'boot_skip');setT(st,'boot_pr');
    if(RM){paint(9);lock();setTimeout(finish,700);return;}
    if(SND.ok()){try{SND.bootPrint(sched,TL);}catch(e){}}
    else if(SND.on&&SND.ctx){try{SND.ctx.resume().then(()=>{if(!ended&&SND.ok())SND.bootPrint(sched,TL);}).catch(()=>{});}catch(e){}}
    tStart=performance.now();
    requestAnimationFrame(frame);
  }
  function start(){
    if(ended)return;
    if(started){if(performance.now()-tStart>600)finish();return;}
    if(starting)return;
    starting=true;
    SND.unlock();
    let done=false;
    const go=()=>{if(done)return;done=true;begin();};
    if(SND.on&&SND.ctx&&SND.ctx.state!=='running'){
      try{SND.ctx.resume().then(go,go);}catch(e){go();}
      setTimeout(go,350);
    }else go();
  }
  function onKey(e){
    if(e.metaKey||e.ctrlKey||e.altKey||e.key==='Tab'||e.key==='Shift')return;
    if(e.key==='Escape'){if(started)finish();else start();return;}
    if(e.target&&(e.target.id==='btPwr'||e.target.id==='btSnd')&&(e.key==='Enter'||e.key===' '))return;
    start();
  }
  el.addEventListener('click',e=>{if(e.target.closest('[data-a="snd"]'))return;start();});
  window.addEventListener('keydown',onKey,true);
  /* with sound on the browser only plays after a tap, so wait for the power key instead of starting silently */
  auto=setTimeout(()=>{if(!started&&!starting&&(!SND.on||SND.ok())){starting=true;begin();}},2800);
  try{$('#btPwr').focus({preventScroll:true});}catch(e){}
  paint(-1);
}
